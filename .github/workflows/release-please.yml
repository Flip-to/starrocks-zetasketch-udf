name: release-please

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-jar:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set Maven project version
        run: ./mvnw -B -ntp versions:set -DnewVersion=${{ needs.release-please.outputs.version }} -DgenerateBackupPoms=false

      - name: Run tests
        run: ./mvnw -B -ntp test

      - name: Build shaded jar
        run: ./mvnw -B -ntp package -DskipTests

      - name: Compute checksums
        id: sums
        run: |
          cd target
          JAR=$(ls starrocks-zetasketch-udf-*-jar-with-dependencies.jar)
          sha256sum "$JAR" | tee "${JAR}.sha256"
          sha256sum "starrocks-zetasketch-udf-${{ needs.release-please.outputs.version }}.jar" \
            | tee "starrocks-zetasketch-udf-${{ needs.release-please.outputs.version }}.jar.sha256"
          echo "jar=${JAR}" >> "$GITHUB_OUTPUT"

      - name: Attach jars to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          fail_on_unmatched_files: true
          files: |
            target/${{ steps.sums.outputs.jar }}
            target/${{ steps.sums.outputs.jar }}.sha256
            target/starrocks-zetasketch-udf-${{ needs.release-please.outputs.version }}.jar
            target/starrocks-zetasketch-udf-${{ needs.release-please.outputs.version }}.jar.sha256
