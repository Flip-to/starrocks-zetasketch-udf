name: release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set Maven project version
        run: ./mvnw -B -ntp versions:set -DnewVersion=${{ steps.ver.outputs.version }} -DgenerateBackupPoms=false

      - name: Run tests
        run: ./mvnw -B -ntp test

      - name: Build shaded jar
        run: ./mvnw -B -ntp package -DskipTests

      - name: Compute checksums
        id: sums
        run: |
          cd target
          JAR=$(ls starrocks-zetasketch-udf-*-jar-with-dependencies.jar)
          sha256sum "$JAR" | tee "${JAR}.sha256"
          sha256sum "starrocks-zetasketch-udf-${{ steps.ver.outputs.version }}.jar" | tee "starrocks-zetasketch-udf-${{ steps.ver.outputs.version }}.jar.sha256"
          echo "jar=${JAR}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            target/${{ steps.sums.outputs.jar }}
            target/${{ steps.sums.outputs.jar }}.sha256
            target/starrocks-zetasketch-udf-${{ steps.ver.outputs.version }}.jar
            target/starrocks-zetasketch-udf-${{ steps.ver.outputs.version }}.jar.sha256
