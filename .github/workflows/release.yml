name: release

# Manual / re-run workflow. The normal release path is release-please.yml,
# which builds and attaches jars inside its own run (avoids the
# GITHUB_TOKEN-doesn't-trigger-workflows trap).
#
# This workflow exists for:
#   - Re-attaching assets to an existing release (e.g. after a manual edit)
#   - Cutting a release from a tag pushed by a human, not by release-please

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing release version to (re)attach assets to (e.g. 0.1.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: v${{ inputs.version }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set Maven project version
        run: ./mvnw -B -ntp versions:set -DnewVersion=${{ inputs.version }} -DgenerateBackupPoms=false

      - name: Run tests
        run: ./mvnw -B -ntp test

      - name: Build shaded jar
        run: ./mvnw -B -ntp package -DskipTests

      - name: Compute checksums
        id: sums
        run: |
          cd target
          JAR=$(ls starrocks-zetasketch-udf-*-jar-with-dependencies.jar)
          sha256sum "$JAR" | tee "${JAR}.sha256"
          sha256sum "starrocks-zetasketch-udf-${{ inputs.version }}.jar" \
            | tee "starrocks-zetasketch-udf-${{ inputs.version }}.jar.sha256"
          echo "jar=${JAR}" >> "$GITHUB_OUTPUT"

      - name: Attach jars to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          fail_on_unmatched_files: true
          files: |
            target/${{ steps.sums.outputs.jar }}
            target/${{ steps.sums.outputs.jar }}.sha256
            target/starrocks-zetasketch-udf-${{ inputs.version }}.jar
            target/starrocks-zetasketch-udf-${{ inputs.version }}.jar.sha256
